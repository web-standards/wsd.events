<!DOCTYPE HTML>
<html lang="ru">
<head>
	<title>Web Standards Days в Минске</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="shower/themes/ribbon/styles/styles.css">
	<style>
		.slide::after {
			content: none;
		}
	</style>
</head>
<body class="shower list">

	<header class="caption">
		<h1>Web Standards Days в Минске</h1>
		<p>1 декабря 2018</p>
	</header>

	<section class="slide">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/wst.svg" width="45%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/emerline.svg" width="70%" class="place">
	</section>
	
	<section class="slide">
		<img src="pictures/adform.svg" width="60%" class="place">
	</section>
	
	<section class="slide">
		<img src="pictures/epam.svg" width="60%" class="place">
	</section>
	
	<section class="slide">
		<img src="pictures/html-academy.svg" width="65%" class="place">
	</section>

	<section class="slide">
		<h2 class="shout">#wstdays</h2>
	</section>

	<section class="slide">
		<h2 class="shout" style="font-size:100px">youtube.com/wstdays</h2>
	</section>

	<section class="slide">
		<h2 class="shout" style="font-size:100px">
			wst@web-standards.ru
		</h2>
	</section>

	<section class="slide">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide">
		<img src="./pictures/wsd-dark.svg" alt="WSD Logo" class="place bottom right" style="width: 25%; right: 5%; bottom: 7%;">
		<img class="cover width" src="pictures/group.jpg">
	</section>

	<div class="progress"></div>

	<script src="shower/shower.min.js"></script>

</body>
</html>
