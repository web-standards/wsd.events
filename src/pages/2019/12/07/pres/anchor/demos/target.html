<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Target Parent</title>
</head>
<body>

    <style>
        body {
            font-size: 3em;
        }

        iframe {
            border: 3px solid black;
            min-height: 50vh;
            width: 45vw;
            margin-top: 20px;
        }
    </style>


    <a href="link.html" target="_blank">_blank</a>
    <br>
    <a href="link.html" target="_self">_self</a>
    <br>
    <a href="link.html" target="_parent">_parent</a>
    <br>
    <a href="link.html" target="_top">_top</a>
    <br>
    <a href="link.html" target="named">named</a>
    <br>
    <iframe src="target-child.html" frameborder="0"></iframe>

    <div style="position: absolute; right: 10px; top: 10px">
        iframe name="named"<br>
        <iframe src="target-child.html" frameborder="0" name="named"></iframe>
    </div>



<!-- Code injected by live-server -->
<script type="text/javascript">
	// <![CDATA[  <-- For SVG support
	if ('WebSocket' in window) {
		(function() {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					head.removeChild(elem);
					var rel = elem.rel;
					if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
					}
					head.appendChild(elem);
				}
			}
			var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
			var address = protocol + window.location.host + window.location.pathname + '/ws';
			var socket = new WebSocket(address);
			socket.onmessage = function(msg) {
				if (msg.data == 'reload') window.location.reload();
				else if (msg.data == 'refreshcss') refreshCSS();
			};
			console.log('Live reload enabled.');
		})();
	}
	// ]]>
</script>
</body>
</html>
