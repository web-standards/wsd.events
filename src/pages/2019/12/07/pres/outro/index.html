<!DOCTYPE HTML>
<html lang="ru">
<head>
	<title>Web Standards Days в Минске</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="shower/themes/ribbon/styles/styles.css">
</head>
<body class="shower list">

	<header class="caption">
		<h1>Web Standards Days в Минске</h1>
		<p>7 декабря 2019</p>
	</header>

	<section class="slide clear">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/wst.svg" width="45%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/evolution-gaming.svg" width="70%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/klika-tech.svg" width="75%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/leverx-group.svg" width="70%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/devschacht.svg" width="40%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/space.jpg" class="cover width place top">
		<img src="pictures/space.svg" width="55%" class="place">
	</section>

	<section class="slide clear">
		<h2 class="shout">#wstdays</h2>
	</section>

	<section class="slide clear">
		<h2 class="shout" style="
			font-size: 110px;
			display: flex;
			justify-content: center;
			align-items: center
		">
			<img src="pictures/youtube.svg" style="
				margin: 0.2em 0.2em 0 0;
				height: 0.8em
			">
			webstandards_ru
		</h2>
	</section>

	<section class="slide clear">
		<h2 class="shout" style="font-size: 100px">
			wst@web-standards.ru
		</h2>
	</section>

	<section class="slide clear">
		<div class="place" style="display: flex; width: 60%">
			<img src="pictures/beerjs.svg" alt="BeerJS" style="margin-right: 50px; width: 35%">
			<h2 style="font-size: 100px">
				Craftman<br>
				Гикало, 5
			</h2>
		</div>
	</section>

	<section class="slide clear">
		<h2 class="shout" style="font-size: 250px">🎤</h2>
	</section>

	<section class="slide clear">
		<img class="place left next"
			style="margin-top: -120px; height: 200px"
			src="pictures/nth-of-type.svg" alt=":nth-of-type(42)">
		<img class="place left next"
			style="margin-top: 120px; height: 200px"
			src="pictures/last-of-type.svg" alt=":last-of-type">
	</section>

	<section class="slide black clear">
		<h2 class="shout" style="color: white">WSD всё</h2>
	</section>

	<section class="slide black clear">
		<img class="cover" src="pictures/carlson.jpg" alt="Карлсон">
	</section>

	<section class="slide clear">
		<h2 class="shout" style="font-size: 120px">
			Веб-стандарты продолжаются
		</h2>
	</section>

	<section class="slide clear">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide clear">
		<img class="cover width" src="pictures/wsd-minsk-2018.jpg">
	</section>

	<div class="progress"></div>

	<script src="shower/shower.min.js"></script>

</body>
</html>
