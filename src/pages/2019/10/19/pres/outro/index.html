<!DOCTYPE HTML>
<html lang="ru">
<head>
	<title>Web Standards Days в Петербурге</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="shower/themes/ribbon/styles/styles.css">
</head>
<body class="shower list">

	<header class="caption">
		<h1>Web Standards Days в Петербурге</h1>
		<p>19 октября 2019</p>
	</header>

	<section class="slide clear">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/wst.svg" width="45%" class="place">
	</section>

	<section class="slide clear">
		<img src="pictures/kontur.svg" width="70%" class="place">
	</section>

	<section class="slide clear">
		<h2 class="shout">#wstdays</h2>
	</section>

	<section class="slide clear">
		<h2 class="shout" style="
			font-size: 110px;
			display: flex;
			justify-content: center;
			align-items: center
		">
			<img src="pictures/youtube.svg" style="
				margin: 0.2em 0.2em 0 0;
				height: 0.8em
			">
			<a href="https://youtube.com/webstandards_ru">webstandards_ru</a>
		</h2>
	</section>

	<section class="slide clear">
		<h2 class="shout" style="font-size: 100px">
			wst@web-standards.ru
		</h2>
	</section>

	<section class="slide clear">
		<img src="pictures/wsd.svg" width="80%" class="place">
	</section>

	<section class="slide clear">
		<img class="cover width" src="pictures/photo.jpg">
	</section>

	<div class="progress"></div>

	<script src="shower/shower.min.js"></script>

</body>
</html>
