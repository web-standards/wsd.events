<!DOCTYPE HTML>
<html lang="ru">
<head>
	<title>Веб-стандарты</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="shower/themes/ribbon/styles/screen-16x10.css">
	<style>
		.slide h2 {
			font-size:50px;
			}
	</style>
</head>
<body class="shower list">

	<header class="caption">
		<h1>Веб-стандарты</h1>
	</header>

	<section class="slide">
		<img src="pictures/wsd.svg" width="70%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/itmo.svg" width="70%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/opera.svg" height="70%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/html-academy.svg" height="70%" class="place">
	</section>

	<section class="slide">
		<h2 class="shout">#wstdays</h2>
	</section>

	<section class="slide">
		<img src="pictures/wst.svg" width="70%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/logo.svg" width="40%" class="place">
	</section>

	<section class="slide">
		<img src="pictures/podcast.jpg" class="cover">
	</section>

	<section class="slide white" id="books">
		<h2 class="shout">Книги</h2>
		<img src="pictures/book-1.jpg" class="place l next">
		<img src="pictures/book-2.jpg" class="place next">
		<img src="pictures/book-3.jpg" class="place r next">
		<style>
			#books img {
				height:100%;
				box-shadow:0 0 60px rgba(0, 0, 0, 0.5);
				}
		</style>
	</section>

	<section class="slide black">
		<img src="pictures/pitercss-old.svg" class="cover">
	</section>

	<section class="slide black">
		<img src="pictures/pitercss-new.svg" class="cover">
	</section>

	<section class="slide black">
		<img src="pictures/pitercss-meetup.png" class="cover">
	</section>

	<section class="slide black">
		<img src="pictures/laptop.jpg" class="cover width">
	</section>

	<section class="slide white">
		<img src="pictures/pitercss-conf.svg" class="cover next">
	</section>

	<section class="slide white">
		<img src="pictures/pitercss-conf.png" class="cover">
	</section>

	<section class="slide">
		<h2 class="shout"><a href="https://pitercss.com/">pitercss.com</a></h2>
	</section>

	<section class="slide">
		<img src="pictures/logo.svg" width="40%" class="place">
	</section>

	<div class="progress"></div>
	<script src="shower/shower.min.js"></script>
</body>
</html>
